{% extends "_layout.html" %}

{% block title %}Gateway Error{% endblock title %}

{% block body %}
<h1>Gateway error</h1>
<p class="muted">The request could not be proxied to the upstream service.</p>
<p class="alert danger">The gateway encountered the error below.</p>
<pre>{{ error | escape }}</pre>
<div class="actions">
  <a class="button-link" href="javascript:location.reload()">Retry request</a>
  <a class="button-link secondary" href="/_auth/login">Back to login</a>
</div>
{% endblock body %}
