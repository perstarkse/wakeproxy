{% extends "_layout.html" %}

{% block title %}Still Waking{% endblock title %}

{% block body %}
<h1>Upstream is still waking</h1>
<p class="muted">Wake cycle <strong>{{ cycle_id }}</strong> is in progress.</p>
<p>
  Current state:
  <span class="status-badge">{{ state }}</span>
</p>
<p class="alert warn">Refresh in a few seconds to retry proxying your request.</p>
<div class="actions">
  <a class="button-link" href="javascript:location.reload()">Refresh now</a>
  <a class="button-link secondary" href="/_auth/login">Back to login</a>
</div>
{% endblock body %}
