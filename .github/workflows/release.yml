name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Verify flake checks
        run: nix flake check

      - name: Build release archive
        run: nix build .#release-archive --print-build-logs

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            result/wakeproxy-linux-x86_64.tar.gz
            result/wakeproxy-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
